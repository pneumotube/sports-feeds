name: Проверка доступа к sports.ru

on:
  workflow_dispatch:        # ручной запуск: проверка + сохранение HTML в папку samples/
  schedule:
    - cron: "17 * * * *"    # каждый час; удалите эти две строки после суточной проверки

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Запросить страницы
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          TS=$(date +%s)
          FAIL=0
          mkdir -p samples
          echo "IP раннера: $(curl -s https://api.ipify.org)"
          for NAME in nhl apl topnews; do
            case $NAME in
              nhl)     URL="https://www.sports.ru/hockey/tournament/nhl/news/?t=$TS" ;;
              apl)     URL="https://www.sports.ru/football/tournament/premier-league/news/?t=$TS" ;;
              topnews) URL="https://www.sports.ru/rss/topnews.xml?t=$TS" ;;
            esac
            echo "=================================================="
            echo "$URL"
            CODE=$(curl -s -L -A "$UA" -H "Accept-Language: ru-RU,ru;q=0.9" \
                   -D headers.txt -o "samples/$NAME.html" -w "%{http_code}" "$URL" || echo "000")
            SIZE=$(stat -c %s "samples/$NAME.html" 2>/dev/null || echo 0)
            LINKS=$(grep -oE "(hockey|football)/[0-9]{9,}" "samples/$NAME.html" | sort -u | wc -l)
            echo "HTTP $CODE | $SIZE байт | ссылок на новости: $LINKS"
            grep -iE "^(server|x-cache-status)" headers.txt || true
            if [ "$CODE" != "200" ] || [ "$LINKS" -lt 10 ]; then
              echo "::error::$NAME: похоже на блокировку (HTTP $CODE, $SIZE байт, $LINKS ссылок)"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Сохранить HTML в репозиторий (только при ручном запуске)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add samples/
          git commit -m "HTML-образцы страниц" || echo "без изменений"
          git push
