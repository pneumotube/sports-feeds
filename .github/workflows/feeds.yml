name: RSS-ленты sports.ru

on:
  schedule:
    - cron: "7,27,47 * * * *"   # каждые 20 минут (GitHub может запускать с опозданием)
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Собрать ленты и сохранить изменения
        run: |
          set +e
          python3 feeds.py
          CODE=$?
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "Новых новостей нет"
          else
            git commit -q -m "Обновление лент"
            git pull -q --rebase
            git push -q
          fi
          exit $CODE
